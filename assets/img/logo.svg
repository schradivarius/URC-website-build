<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Houston Apollos mark">
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ec2743"/>
      <stop offset="1" stop-color="#8c0a1f"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="46" height="46" rx="12" fill="#101116" stroke="#262931"/>
  <!-- orbital ring -->
  <ellipse cx="24" cy="24" rx="17" ry="7.5" fill="none" stroke="url(#lg)" stroke-width="2"
           transform="rotate(-28 24 24)"/>
  <!-- planet -->
  <circle cx="24" cy="24" r="8.5" fill="#1b1d23" stroke="#c8102e" stroke-width="2"/>
  <path d="M18.5 21.5c2.6 1.8 5.4 1.8 8 0M17.8 26.4c3.4 2 7.6 1.6 10.6-1" fill="none"
        stroke="#c8102e" stroke-width="1.4" stroke-linecap="round" opacity=".8"/>
  <!-- rover spark -->
  <circle cx="37.5" cy="12.5" r="2.6" fill="#ec2743"/>
</svg>
