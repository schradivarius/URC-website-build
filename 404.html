<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal lost — Houston Apollos</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#08090b">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/fonts/fonts.css">

<!--
  This page is served for any URL that doesn't exist, at any path depth, so
  its styles are inlined rather than pulled from assets/css/style.css — a
  stylesheet referenced relatively would 404 too on a deep URL, leaving an
  unstyled page. Everything it needs is right here.
-->
<style>
  :root {
    --scarlet: #c90000;
    --scarlet-bright: #ef1414;
    --black: #08090b;
    --text: #f2f3f5;
    --muted: #8d939d;
    --border: #262931;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: 40px 16px;
    background: var(--black);
    color: var(--text);
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-size: 17px;
    line-height: 1.65;
    text-align: center;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0 0 auto 0;
    height: 80vh;
    background:
      radial-gradient(55% 55% at 50% 0%, rgba(201, 0, 0, 0.16), transparent 70%);
    pointer-events: none;
  }

  .wrap { position: relative; max-width: 600px; }

  .code {
    font-family: 'Space Grotesk', system-ui, sans-serif;
    font-size: clamp(5rem, 22vw, 10rem);
    font-weight: 700;
    line-height: 0.9;
    letter-spacing: -0.04em;
    margin: 0 0 8px;
    color: var(--scarlet);
  }

  h1 {
    font-family: 'Space Grotesk', system-ui, sans-serif;
    font-size: clamp(1.5rem, 5vw, 2.25rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0 0 16px;
  }

  p { color: var(--muted); margin: 0 auto 32px; max-width: 46ch; }

  .row {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    justify-content: center;
  }

  a.btn {
    display: inline-flex;
    align-items: center;
    padding: 14px 26px;
    border: 1px solid transparent;
    border-radius: 999px;
    background: var(--scarlet);
    color: #fff;
    font-family: 'Space Grotesk', system-ui, sans-serif;
    font-weight: 600;
    font-size: 0.95rem;
    text-decoration: none;
    transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
  }

  a.btn:hover { transform: translateY(-2px); box-shadow: 0 14px 30px -14px rgba(201, 0, 0, 0.5); }

  a.btn--ghost { background: transparent; border-color: #343842; color: var(--text); }
  a.btn--ghost:hover { border-color: var(--scarlet); background: rgba(201, 0, 0, 0.08); }

  a.btn:focus-visible { outline: 2px solid var(--scarlet-bright); outline-offset: 3px; }

  .mark { margin: 0 auto 28px; display: block; }

  .sig {
    margin-top: 40px;
    font-family: 'Space Grotesk', system-ui, sans-serif;
    font-size: 0.72rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--scarlet);
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0.001ms !important; }
  }
</style>
</head>
<body>
  <main class="wrap">
    <svg class="mark" width="52" height="52" viewBox="0 0 48 48" aria-hidden="true">
      <rect x="1" y="1" width="46" height="46" rx="12" fill="#101116" stroke="#262931"/>
      <ellipse cx="24" cy="24" rx="17" ry="7.5" fill="none" stroke="#c90000" stroke-width="2"
               transform="rotate(-28 24 24)"/>
      <circle cx="24" cy="24" r="8.5" fill="#1b1d23" stroke="#c90000" stroke-width="2"/>
      <circle cx="37.5" cy="12.5" r="2.6" fill="#ef1414"/>
    </svg>

    <p class="code">404</p>
    <h1>Signal lost.</h1>
    <p>
      This page isn't on any map we have. The rover drove past the last waypoint
      and we lost telemetry &mdash; let's get you back to known terrain.
    </p>

    <div class="row">
      <a class="btn" href="index.html">Back to base</a>
      <a class="btn btn--ghost" href="rover.html">See the rover</a>
    </div>

    <p class="sig">Ad astra</p>
  </main>
</body>
</html>
